services:
  - type: web
    name: phulo-mern
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: UPLOAD_STORAGE_LIMIT_MB
        value: "400"
      - key: AUTO_SEED
        value: "true"
      - key: BOOTSTRAP_ADMIN
        value: "true"
      - key: ADMIN_NAME
        value: PHULO Admin
      - key: ADMIN_EMAIL
        value: phulomultigraphics@gmail.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: COOKIE_SAME_SITE
        value: lax
