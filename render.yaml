services:
  - type: web
    name: phulo-multi-graphics
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
    disk:
      name: phulo-data
      mountPath: /app/data
      sizeGB: 1
